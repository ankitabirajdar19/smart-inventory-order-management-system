spring:
  application.name: smart-inventory
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:inventory_db}
    username: ${POSTGRES_USER:inventory_user}
    password: ${POSTGRES_PASSWORD:}
    hikari: { maximum-pool-size: 20, minimum-idle: 5 }
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate      # Flyway owns the schema
    properties.hibernate:
      jdbc.time_zone: UTC
      jdbc.batch_size: 50
  flyway: { enabled: true, locations: "classpath:db/migration" }
  jackson:
    time-zone: UTC
    serialization.write-dates-as-timestamps: false
  servlet.multipart: { max-file-size: 5MB, max-request-size: 25MB }
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}             # no default: app refuses to start without it
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors.allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage.local-dir: ${STORAGE_DIR:./uploads}
  shipping: { flat-fee: 50.00, free-threshold: 1000.00 }
  order: { reservation-ttl: 15m, expiry-check-interval-ms: 60000 }
  payment.allow-simulation: false
  cookie: { secure: true, same-site: Strict }
  rate-limit.auth-per-minute: 10

management:
  endpoints.web.exposure.include: health,info
server:
  forward-headers-strategy: framework
  error: { include-stacktrace: never, include-message: never }
